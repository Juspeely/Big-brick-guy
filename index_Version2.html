<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom LEGO Figures Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">BrickCustoms</h1>
      <nav class="nav">
        <a href="#home" class="nav-link">Home</a>
        <a href="#products" class="nav-link">Products</a>
        <a href="#add" class="nav-link">Admin Panel</a>
        <a href="#cart" class="nav-link">Cart (<span id="cartCount">0</span>)</a>
      </nav>
    </div>
  </header>

  <main id="app" class="container">
    <section id="home">
      <h2>Welcome to BrickCustoms</h2>
      <p>Custom LEGO minifigures and decals. Use the Admin Panel to add or remove products.</p>
    </section>

    <section id="products">
      <h2>Products</h2>
      <div id="productList" class="grid"></div>
    </section>

    <section id="add">
      <h2>Admin Panel — Add / Remove Products</h2>
      <div class="admin">
        <form id="addForm">
          <label>Emoji <input id="emoji" type="text" maxlength="2" placeholder="🪖"></label>
          <label>Name <input id="pname" type="text" required placeholder="Product name"></label>
          <label>Price <input id="price" type="number" step="0.01" min="0" required placeholder="0.00"></label>
          <button type="submit" class="btn">Add product</button>
        </form>

        <h3>Existing products</h3>
        <div id="adminList"></div>
      </div>
    </section>

    <section id="cart">
      <h2>Cart</h2>
      <div id="cartPanel"></div>
      <div class="note">Checkout is not connected.</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> BrickCustoms — Custom LEGO minifigures</small>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
